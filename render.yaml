services:
  - type: web
    name: lapor-sampah-be
    runtime: node
    rootDir: be
    buildCommand: npm ci && npm run build && ./scripts/fetch-model.sh && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_MODEL_PATH
        value: ./models/best.onnx
      # URL unduhan best.onnx (GitHub Release). Wajib diisi karena model
      # tidak di-commit ke repo. Contoh:
      # https://github.com/ukisyauqi/blicode-test/releases/download/model-v1/best.onnx
      - key: ML_MODEL_URL
        sync: false
      # Pakai Neon pooled connection string (ada ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # URL Vercel frontend, mis. https://lapor-sampah.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
