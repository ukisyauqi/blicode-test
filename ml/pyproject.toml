[project]
name = "waste-classifier"
version = "0.1.0"
description = "Klasifikasi gambar sampah: organic, plastic, paper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.6",
]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
]
api = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
waste-train = "waste_classifier.train:main"
waste-predict = "waste_classifier.predict:main"
waste-evaluate = "waste_classifier.evaluate:main"
waste-export = "waste_classifier.export:main"
waste-api = "waste_classifier.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waste_classifier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
